# UVTA co-training: wrist RGB + fingertip tactile -> actions + future tactile.
# Set UVTA_ROOT to the repository path; UVTA_DATA_ROOT defaults to its data/.
uvta_root: ${oc.env:UVTA_ROOT}
data_root: ${oc.env:UVTA_DATA_ROOT,${oc.env:UVTA_ROOT}/data}

# Shared task configuration; light_bulb uses training.epochs=500.
task: flip_book   # flip_book | light_bulb | switch | ball | tube

hydra:
  run:
    dir: ${oc.env:UVTA_OUTPUT_DIR,${oc.env:UVTA_ROOT}/experiments}/${now:%Y-%m-%d_%H-%M-%S}

project_name: UVTA
task_name: ${task}

debug: False
action_dim: 31

ema:
  _target_: uvta.common.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

training:
  epochs: 300
  gradient_accumulation_steps: 1
  batch_size: 250
  num_workers: 4
  shuffle: True
  # Uniform sampling balances datasets; epoch length still depends on size.
  sampler: uniform
  seed: 0
  pin_memory: False
  persistent_workers: True
  drop_last: False
  ckpt_frequency: 100
  resume: False
  model_path: null
  model_ckpt: null
  use_ema: True
  log_interval: 50
  log_detailed_loss: True
  # Equal wrist/hand MSE weights; tactile MSE is added with weight 0.2.
  balanced_action_loss: True
  action_loss_group_weights:
    action_eef: 1.0
    action_hand: 1.0

  world_head_weights:
    tactile: 0.2
  world_head_hidden: 512
  log_per_embodiment_loss: True

validation:
  enabled: False
  # null evaluates all episodes in the configured validation stores.
  max_episode: null
  eval_frequency: 20
  batch_size: 200
  num_workers: 2
  pin_memory: False
  persistent_workers: True
  use_ema: True
  seed: 1234
  # Replace with held-out paths before enabling validation.
  datasets:
    - name: robot
      data_dirs: [
        "${data_root}/${task}/robot",
      ]
      data_dirs_embodiment: [robot]

noise_scheduler:
  _target_: diffusers.DDIMScheduler
  num_train_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: True
  prediction_type: epsilon
num_inference_steps: 16

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  betas: [0.9, 0.999]
  weight_decay: 1e-2
  eps: 1e-08

lr_scheduler: "cosine"
num_warmup_steps: 300
# Keep the cosine horizon tied to the training duration.
lr_scheduler_steps_epochs: ${training.epochs}
lr_min_ratio: 1e-2

dataset:
  _target_: uvta.diffusion_policy.dataloader.uvta_dataset.UVTADataset
  # Paths and embodiment labels must have matching order.
  data_dirs: [
    "${data_root}/${task}/robot",
    "${data_root}/${task}/human",
  ]
  data_dirs_embodiment: [robot, human]
  load_camera_ids: [0]
  camera_resize_shape: [240,240]
  pred_horizon: 16
  obs_horizon: 1
  down_sample_steps: 3
  action_horizon: 8
  unnormal_list: ["camera_0","pose"]
  optional_transforms: ["Resize","RandomCrop","ColorJitter","RandomGrayscale","GaussianBlur"]
  relative_hand_action: False

  # Normalize human and robot data separately; deploy with robot statistics.
  norm_method: minmax
  norm_clip_sigma: null
  norm_clip_percentile: 1.0
  fsr_norm_clip_percentile: null
  norm_per_embodiment: True
  stats_primary_embodiment: robot
  proprio_mode: none
  skip_proprioception: True
  hand_action_mode: joint

  # Keep predict_state explicitly false; tactile uses a separate MLP head.
  predict_action: True
  predict_state: False
  predict_tactile: True
  aux_as_head: [tactile]
  ring_overlay:
    enabled: True
    embodiments: [human]
    mask_path: ${uvta_root}/assets/ring/ring_mask.png
    rgb_path:  ${uvta_root}/assets/ring/ring_patch_rgb.png
    bgr2rgb_assets: True

  enable_fsr: True
  fsr_source_key: tactile
  fsr_binarize: False
  fsr_binary_cutoff: [100]
  fsr_baseline_correct: True
  fsr_baseline_frames: 5
  # Human: mean of first five frames. Robot: first frame. Clamp at zero.
  fsr_baseline_embodiments: [human]
  fsr_baseline_first_frame_embodiments: [robot]
  bgr2rgb: False
  # Per-dataset episode limits; null loads all episodes.
  max_episode: [null, null]

model:
  _target_: uvta.diffusion_policy.diffusion_policy.DiffusionPolicy
  vision_backbone_kwargs:
    model_name: "vit_small_patch8_224.dino"
  freeze_vision_back: False
  diffusion_policy_head:
    _target_: uvta.diffusion_policy.model.diffusion_model.ConditionalUnet1D
    input_dim: ${action_dim}    # fallback; overridden by trainer dry-run
    global_cond_dim: 384        # fallback; overridden by trainer dry-run
