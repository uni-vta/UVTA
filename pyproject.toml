[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uvta"
version = "0.1.0"
description = "UVTA: Unified Visual-Tactile-Action Modeling from Human Demonstrations for Dexterous Manipulation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Install requirements.txt after selecting a CUDA-compatible PyTorch wheel.
dependencies = []

[tool.setuptools.packages.find]
# Package the library; run scripts and hardware utilities from the clone.
include = ["uvta*"]
